<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marble Animation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .marble-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }

        img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            opacity: 0.4;
            transition: opacity 0.3s, transform 0.3s;
        }

        img.active {
            opacity: 1;
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <h2>Moving Marble Animation</h2>
    <div class="marble-container">
        <img src="img/images.png" class="marble active" onmouseenter="stopAnimation()" onmouseleave="startAnimation()">
        <img src="img/images.png" class="marble" onmouseenter="stopAnimation()" onmouseleave="startAnimation()">
        <img src="img/images.png" class="marble" onmouseenter="stopAnimation()" onmouseleave="startAnimation()">
        <img src="img/images.png" class="marble" onmouseenter="stopAnimation()" onmouseleave="startAnimation()">
        <img src="img/images.png" class="marble" onmouseenter="stopAnimation()" onmouseleave="startAnimation()">
    </div>
    <script>
        var marbles = document.getElementsByClassName("marble");
        var activeIndex = 0;
        var animationInterval;
        var speed = 1000;

        function moveMarble() {
            marbles[activeIndex].classList.remove("active");
            activeIndex = (activeIndex + 1) % marbles.length;
            marbles[activeIndex].classList.add("active");
        }

        function startAnimation() {
            if (!animationInterval) {
                animationInterval = setInterval(moveMarble, speed);
            }
        }

        function stopAnimation() {
            clearInterval(animationInterval);
            animationInterval = null;
        }

        startAnimation();
    </script>
</body>

</html>
