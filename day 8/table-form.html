<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Data Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2c94c;
            padding: 30px;
            text-align: center;
        }

        .form-container {
            display: inline-block;
            text-align: left;
            background: #f2c94c;
            padding: 20px;
            border: 1px solid #999;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: inline-block;
            width: 80px;
            font-weight: bold;
        }

        input {
            padding: 5px;
            width: 200px;
        }

        .error {
            color: red;
            font-size: 12px;
            margin-left: 10px;
            display: inline;
        }

        button {
            padding: 5px 15px;
            margin-right: 10px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
            background: #fff;
        }

        th,
        td {
            border: 2px solid #555;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <form id="userForm" onsubmit="addData(event)">
            <div class="field">
                <label>Name</label>
                <input type="text" id="name" required>
                <span id="nameError" class="error"></span>
            </div>
            <div class="field">
                <label>Age</label>
                <input type="text" id="age" required>
                <span id="ageError" class="error"></span>
            </div>
            <div class="field">
                <label>E-mail</label>
                <input type="text" id="email" required>
                <span id="emailError" class="error"></span>
            </div>
            <div>
                <button type="submit">Add</button>
                <button type="reset" onclick="clearErrors()">Reset</button>
            </div>
        </form>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>E-mail</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script>
        function clearErrors() {
            document.getElementById("nameError").textContent = "";
            document.getElementById("ageError").textContent = "";
            document.getElementById("emailError").textContent = "";
        }

        function addData(e) {
            e.preventDefault();
            clearErrors();

            var nameInput = document.getElementById("name").value.trim();
            var ageInput = document.getElementById("age").value.trim();
            var emailInput = document.getElementById("email").value.trim();
            var isValid = true;

            if (nameInput === "" || !isNaN(nameInput)) {
                document.getElementById("nameError").textContent = "Name must be characters only";
                isValid = false;
            }

            if (ageInput === "" || isNaN(ageInput) || parseInt(ageInput) <= 0) {
                document.getElementById("ageError").textContent = "Age must be a valid number";
                isValid = false;
            }

            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(emailInput)) {
                document.getElementById("emailError").textContent = "Not a valid e-mail";
                isValid = false;
            }

            if (isValid) {
                var tbody = document.getElementById("dataTable").getElementsByTagName("tbody")[0];
                var newRow = tbody.insertRow();
                var cell1 = newRow.insertCell(0);
                var cell2 = newRow.insertCell(1);
                var cell3 = newRow.insertCell(2);

                cell1.textContent = nameInput;
                cell2.textContent = ageInput;
                cell3.textContent = emailInput;

                document.getElementById("userForm").reset();
            }
        }
    </script>
</body>

</html>
