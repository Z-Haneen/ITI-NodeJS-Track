<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITI Final Project | Full Interactive Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            padding: 30px 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 8px;
        }

        p.sub {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .card h2 {
            font-size: 1.2rem;
            color: #f1f5f9;
            margin-bottom: 15px;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 0.9rem;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        button:hover {
            background: #0369a1;
        }

        button.success-btn {
            background: #10b981;
        }

        button.success-btn:hover {
            background: #059669;
        }

        button.danger {
            background: #dc2626;
            width: auto;
            padding: 5px 12px;
            font-size: 0.8rem;
        }

        button.danger:hover {
            background: #b91c1c;
        }

        .token-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #334155;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.8rem;
            color: #34d399;
            margin-top: 10px;
            max-height: 80px;
            overflow-y: auto;
        }

        .posts-list {
            display: grid;
            gap: 15px;
        }

        .post-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-info h4 {
            color: #38bdf8;
            font-size: 1rem;
        }

        .post-info p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: none;
        }

        .alert.success {
            background: #064e3b;
            color: #34d399;
        }

        .alert.error {
            background: #450a0a;
            color: #f87171;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background: #334155;
            color: #94a3b8;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background: #0284c7;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1> ITI Node.js Interactive App</h1>
            <p class="sub">Test Signup, Login, Authorization, and Users Management live on Vercel!</p>
        </header>

        <div class="grid">
            <!-- 1️ Auth Section (Signup & Login Tabs) -->
            <div class="card">
                <h2> Authentication</h2>
                <div id="auth-alert" class="alert"></div>

                <div class="tabs">
                    <div id="tab-login-btn" class="tab-btn active" onclick="switchAuthTab('login')">Login</div>
                    <div id="tab-signup-btn" class="tab-btn" onclick="switchAuthTab('signup')">Create Account (Signup)
                    </div>
                </div>

                <!-- Login Form -->
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required placeholder="mona.ahmed@iti.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-pass" required placeholder="Password123!">
                    </div>
                    <button type="submit">Login & Get Token</button>
                </form>

                <!-- Signup Form (Hidden by default) -->
                <form id="signup-form" style="display: none;">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signup-name" required placeholder="Haneen Wael">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="signup-email" required placeholder="haneen@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signup-pass" required placeholder="StrongPass123!">
                    </div>
                    <button type="submit" class="success-btn">Create Account (Signup)</button>
                </form>

                <div class="form-group" style="margin-top: 15px;">
                    <label>Active JWT Token:</label>
                    <div id="token-display" class="token-box">No token saved yet. Please Login.</div>
                </div>
            </div>

            <!-- 2️ Create User / Action Section -->
            <div class="card">
                <h2>👤 Create New User / Admin</h2>
                <div id="post-alert" class="alert"></div>
                <form id="create-post-form">
                    <div class="form-group">
                        <label>User Name</label>
                        <input type="text" id="post-title" required placeholder="Enter name...">
                    </div>
                    <div class="form-group">
                        <label>User Email</label>
                        <input type="email" id="post-content" required placeholder="Enter email address...">
                    </div>
                    <button type="submit">Add User to Database</button>
                </form>
            </div>
        </div>

        <!-- 3️ Users Feed -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>👥 Registered Users List</h2>
                <button onclick="fetchItems()" style="width: auto; padding: 6px 15px; font-size: 0.85rem;"> Refresh
                    List</button>
            </div>
            <div id="items-container" class="posts-list">
                <p style="color: #64748b; text-align: center;">Click Refresh or Login to load users...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        //const API_URL = "https://iti-node-js-track.vercel.app";
        let savedToken = localStorage.getItem('jwt_token') || '';

        if (savedToken) {
            document.getElementById('token-display').innerText = savedToken;
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const loginTab = document.getElementById('tab-login-btn');
            const signupTab = document.getElementById('tab-signup-btn');

            if (tab === 'signup') {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                loginTab.classList.remove('active');
                signupTab.classList.add('active');
            } else {
                signupForm.style.display = 'none';
                loginForm.style.display = 'block';
                signupTab.classList.remove('active');
                loginTab.classList.add('active');
            }
        }

        function showAlert(elementId, msg, isSuccess) {
            const el = document.getElementById(elementId);
            el.innerText = msg;
            el.className = `alert ${isSuccess ? 'success' : 'error'}`;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        // 1️ Handle Login -> /api/login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pass').value;

            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && (data.token || data.accessToken)) {
                    savedToken = data.token || data.accessToken;
                    localStorage.setItem('jwt_token', savedToken);
                    document.getElementById('token-display').innerText = savedToken;
                    showAlert('auth-alert', 'Login successful! Token saved.', true);
                    fetchItems();
                } else {
                    showAlert('auth-alert', data.message || 'Login failed! Check email/pass', false);
                }
            } catch (err) {
                showAlert('auth-alert', 'Error connecting to server!', false);
            }
        });

        // 2️ Handle Signup -> /api/signup
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-pass').value;

            try {
                const res = await fetch(`${API_URL}/api/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    showAlert('auth-alert', 'Account created successfully! Switching to login...', true);
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-pass').value = password;
                    setTimeout(() => switchAuthTab('login'), 1500);
                } else {
                    showAlert('auth-alert', data.message || 'Signup failed!', false);
                }
            } catch (err) {
                showAlert('auth-alert', 'Error connecting to server!', false);
            }
        });

        // 3️ Create User -> /api/users
        document.getElementById('create-post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!savedToken) return showAlert('post-alert', 'Please login first to get a token!', false);

            const name = document.getElementById('post-title').value;
            const email = document.getElementById('post-content').value;

            try {
                const res = await fetch(`${API_URL}/api/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${savedToken}`
                    },
                    body: JSON.stringify({ name, email, password: 'User123!' })
                });
                const data = await res.json();

                if (res.ok) {
                    showAlert('post-alert', 'User created successfully!', true);
                    document.getElementById('create-post-form').reset();
                    fetchItems();
                } else {
                    showAlert('post-alert', data.message || 'Failed to create user', false);
                }
            } catch (err) {
                showAlert('post-alert', 'Error submitting user', false);
            }
        });

        // 4️ Fetch Users List -> /api/users
        async function fetchItems() {
            const container = document.getElementById('items-container');
            try {
                const res = await fetch(`${API_URL}/api/users`, {
                    headers: savedToken ? { 'Authorization': `Bearer ${savedToken}` } : {}
                });
                const data = await res.json();

                if (res.ok && Array.isArray(data)) {
                    if (data.length === 0) {
                        container.innerHTML = '<p style="color: #64748b; text-align: center;">No users found in database.</p>';
                        return;
                    }
                    container.innerHTML = data.map(item => `
                        <div class="post-card">
                            <div class="post-info">
                                <h4>${item.name || item.username || 'User'}</h4>
                                <p>${item.email || ''} - <strong style="color:#38bdf8">${item.role || 'user'}</strong></p>
                            </div>
                            <button class="danger" onclick="deleteItem('${item._id}')">Delete</button>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<p style="color: #f87171; text-align: center;">${data.message || 'Login required to view users.'}</p>`;
                }
            } catch (err) {
                container.innerHTML = '<p style="color: #f87171; text-align: center;">Error loading users.</p>';
            }
        }

        // 5️ Delete User -> /api/users/:id
        async function deleteItem(id) {
            if (!savedToken) return alert('Please login first!');
            if (!confirm('Are you sure you want to delete this user?')) return;

            try {
                const res = await fetch(`${API_URL}/api/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${savedToken}` }
                });
                if (res.ok) {
                    fetchItems();
                } else {
                    const data = await res.json();
                    alert(data.message || 'Failed to delete user');
                }
            } catch (err) {
                alert('Error deleting user');
            }
        }
    </script>

</body>

</html>
