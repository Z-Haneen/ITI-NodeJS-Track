<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Object Tests</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .box {
            padding: 15px;
            border: 1px solid #ccc;
            background: #eef;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h3> numeric input accepts numbers only </h3>
        <input type="text" id="numericInput" placeholder="Numbers only">
    </div>
    <script>
        var disableBox = document.querySelectorAll(".box")[0];
        disableBox.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });

        window.addEventListener("keydown", function (e) {
            var ascii = e.keyCode || e.which;
            var altPressed = e.altKey ? "Yes" : "No";
            var ctrlPressed = e.ctrlKey ? "Yes" : "No";
            var shiftPressed = e.shiftKey ? "Yes" : "No";
            alert("ASCII Code: " + ascii + "\nAlt: " + altPressed + "\nCtrl: " + ctrlPressed + "\nShift: " + shiftPressed);
        });

        var numInput = document.getElementById("numericInput");
        numInput.addEventListener("keypress", function (e) {
            var charCode = e.which ? e.which : e.keyCode;
            if (charCode > 31 && (charCode < 48 || charCode > 57)) {
                e.preventDefault();
            }
        });
    </script>
</body>

</html>
