<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day 10</title>
    <style>
        #tabs-container {
            display: flex;
            flex-wrap: wrap;
            background-color: #2c3e50;
            padding: 10px;
            gap: 10px;
        }

        .tab-btn {
            background-color: #5dade2;
            color: #1c2833;
            border: 1px solid #1f618d;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .tab-btn:hover {
            background-color: #2980b9;
            color: white;
        }

        .tab-btn.active {
            background-color: #cb4335;
            color: white;
        }

        #posts-container {
            margin-top: 20px;
            padding: 10px;
        }

        ul {
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div id="tabs-container"></div>

    <div id="posts-container">
        <h3>User Posts:</h3>
        <ul id="posts-list"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
