<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcoming Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 20px;
            width: 400px;
            background: #fafafa;
        }

        h1 {
            color: #2d9cdb;
        }

        p {
            font-size: 16px;
            margin: 10px 0;
        }

        strong {
            display: inline-block;
            width: 100px;
        }
    </style>
</head>

<body>
    <div id="welcome-content" class="card"></div>
    <script>
        var params = {};
        var queryString = location.search.substring(1);
        var pairs = queryString.split("&");
        for (var i = 0; i < pairs.length; i++) {
            var pair = pairs[i].split("=");
            params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || "").replace(/\+/g, " ");
        }

        var container = document.getElementById("welcome-content");
        if (params.username) {
            container.innerHTML = "<h1>Welcome " + params.username + " (" + params.title + ")</h1>" +
                "<p><strong>Email:</strong> " + params.email + "</p>" +
                "<p><strong>Mobile:</strong> " + params.mobile + "</p>" +
                "<p><strong>Gender:</strong> " + params.gender + "</p>" +
                "<p><strong>Address:</strong> " + params.address + "</p>";
        } else {
            container.innerHTML = "<h1>Error: No data received</h1>";
        }
    </script>
</body>

</html>
