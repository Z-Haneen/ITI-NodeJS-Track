<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day two</title>
</head>

<body>
    <h1><u>Table:</u></h1>
    <hr color="blue">
    <table width="600" border="2" align="center" cellpadding="10" cellspacing="5">
        <thead>
            <tr bgcolor="lightblue">

                <th>Name</th>
                <th>Age</th>
                <th>Details</th>
            </tr>
        </thead>
        <tr bgcolor="lightgray">
            <td>
                <font color="blue">John</font>
            </td>
            <td>25</td>
            <td rowspan="2">Merged Rows</td>
        </tr>
        <tr bgcolor="lightgray">
            <td colspan="2">Merged Columns</td>
        </tr>
        <tr bgcolor="lightgray">
            <td>
                <font color="green">Jane
            </td>
            <td>30</td>
            <td>
                <table border="1" align="center" cellpadding="10" cellspacing="5">
                    <tr bgcolor="yellow">
                        <td>nested table</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tfoot>
            <tr>
                <td>john Doe</td>
                <td>25</td>
                <td align="right">This is some long text that<br>will not wrap.</td>
            </tr>
        </tfoot>

    </table>
</body>

</html>
