<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Window</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Parent Window</h2>
    <button onclick="openChildWindow()">Open Child Window</button>
    <script>
        var childWindow;
        function openChildWindow() {
            childWindow = window.open("", "ChildWindow", "width=400,height=300");
            childWindow.document.write("<h1>I will close in 5 seconds</h1>");
            setTimeout(function () {
                if (childWindow) {
                    childWindow.close();
                }
            }, 5000);
        }
    </script>
</body>

</html>
