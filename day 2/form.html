<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
</head>

<body>
    <form action="welcome.html">

        <label>Username : <input type="text" name="username" /> </label>



        <hr />

        <label>password : <input type="password" name="password" /></label>

        <hr />

        <label>male <input type="radio" name="gender" value="male" /> </label>
        <label>female <input type="radio" name="gender" value="female" /> </label>

        <hr />

        <label>football <input type="checkbox" name="hobby" value="football" /></label>
        <label>swimming <input type="checkbox" name="hobby" value="swimming" /></label>
        <label>reading <input type="checkbox" name="hobby" value="reading" /></label>

        <hr />

        <label>
            select country :
            <select name="country">
                <option value="Egypt">Egypt</option>
                <option value="Canada">Canada</option>
                <option value="UK">UK</option>
            </select>
        </label>

        <hr />
        <input type="file" name="file" />
        <hr />

        <textarea name="textarea" rows="5" cols="5"></textarea>

        <hr />

        <input type="date" name="date" />
        <input type="color" name="color" />
        <input type="number" name="number" />
        <input type="range" name="range" min="5" max="10" />

        <hr />

        <hr />

        <input type="submit" value="send data" />

        <hr />
        <input type="image" src="../day 2/assets/button.jpg" width="50" height="50" />

        <hr />

        <input type="reset" value="reset my form" />
    </form>
</body>

</html>
